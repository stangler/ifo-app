<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>デイトレ IFO計算ツール</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            background: #111; 
            color: #fff; 
            padding: 15px; 
            margin: 0; 
        }
        h1 { text-align: center; font-size: 22px; margin: 10px 0 20px; }
        .mode { text-align: center; margin-bottom: 15px; }
        button.modeBtn { 
            padding: 10px 22px; 
            font-size: 17px; 
            margin: 5px; 
            border: none; 
            border-radius: 8px; 
        }
        .long { background: #0066ff; color: white; }
        .short { background: #ff3300; color: white; }
        .active { font-weight: bold; box-shadow: 0 0 0 3px #fff; }

        .input-group { margin: 12px 0; }
        .label { font-size: 15px; color: #ccc; margin-bottom: 4px; }
        input { 
            width: 100%; 
            padding: 14px; 
            font-size: 22px; 
            border-radius: 10px; 
            border: none; 
            background: #222; 
            color: #fff;
        }

        .result { 
            background: #1f1f1f; 
            padding: 18px; 
            border-radius: 12px; 
            margin-top: 20px; 
            font-size: 18.5px;
            line-height: 2;
        }
        .ok { color: #00ff99; font-weight: bold; }
        .ng { color: #ff6666; font-weight: bold; }
        .info { color: #aaa; font-size: 15px; }
    </style>
</head>
<body>
    <h1>デイトレ IFO計算ツール</h1>
    
    <div class="mode">
        <button id="longBtn" class="modeBtn long active" onclick="setMode('long')">ロング</button>
        <button id="shortBtn" class="modeBtn short" onclick="setMode('short')">ショート</button>
    </div>

    <div class="input-group">
        <div class="label">入力モードを選択</div>
        <button onclick="setInputMode('entry')" id="entryBtn" style="background:#333; color:white; padding:8px 16px; margin:5px;">エントリー価格から計算</button>
        <button onclick="setInputMode('sl')" id="slBtn" style="background:#333; color:white; padding:8px 16px; margin:5px;">SL価格から計算</button>
    </div>

    <div class="input-group">
        <div class="label" id="inputLabel">エントリー価格</div>
        <input type="number" id="mainInput" placeholder="例: 1250.0" step="0.01" oninput="calculate()">
    </div>

    <div id="result" class="result">
        モードと価格を入力してください
    </div>

    <script>
        let currentMode = 'long';      // long or short
        let inputType = 'entry';       // 'entry' or 'sl'

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('longBtn').classList.toggle('active', mode === 'long');
            document.getElementById('shortBtn').classList.toggle('active', mode === 'short');
            calculate();
        }

        function setInputMode(type) {
            inputType = type;
            const label = document.getElementById('inputLabel');
            const btnEntry = document.getElementById('entryBtn');
            const btnSL = document.getElementById('slBtn');

            if (type === 'entry') {
                label.textContent = 'エントリー価格';
                btnEntry.style.background = '#0066ff';
                btnSL.style.background = '#333';
            } else {
                label.textContent = 'SL価格（根拠崩壊ライン）';
                btnEntry.style.background = '#333';
                btnSL.style.background = '#ff3300';
            }
            calculate();
        }

        function calculate() {
            const inputVal = parseFloat(document.getElementById('mainInput').value);
            const resultDiv = document.getElementById('result');

            if (!inputVal || isNaN(inputVal)) {
                resultDiv.innerHTML = '価格を入力してください';
                return;
            }

            const slPct = 0.35;                    // 固定
            const tpPct = (slPct * 1.67).toFixed(3); // ≈ 0.5845

            let entryPrice, slPrice, tpPrice;

            if (inputType === 'entry') {
                // エントリー価格から計算
                entryPrice = inputVal;
                if (currentMode === 'long') {
                    slPrice = entryPrice * (1 - slPct / 100);
                    tpPrice = entryPrice * (1 + tpPct / 100);
                } else {
                    slPrice = entryPrice * (1 + slPct / 100);
                    tpPrice = entryPrice * (1 - tpPct / 100);
                }
            } else {
                // SL価格から計算
                slPrice = inputVal;
                if (currentMode === 'long') {
                    entryPrice = slPrice / (1 - slPct / 100);
                    tpPrice = entryPrice * (1 + tpPct / 100);
                } else {
                    entryPrice = slPrice / (1 + slPct / 100);
                    tpPrice = entryPrice * (1 - tpPct / 100);
                }
            }

            const judgment = (parseFloat(tpPct) >= 0.58) 
                ? `<span class="ok">エントリーOK（RRR 1.67）</span>`
                : `<span class="ng">TP幅不足 → 見送り</span>`;

            resultDiv.innerHTML = `
                <strong>モード: ${currentMode.toUpperCase()}</strong><br>
                SL幅: <strong>0.35%</strong>（固定）<br>
                TP幅: <strong>${tpPct}%</strong><br><br>
                
                エントリー価格: <strong>${entryPrice.toFixed(2)}</strong><br>
                SL価格: <strong>${slPrice.toFixed(2)}</strong><br>
                提案TP価格: <strong>${tpPrice.toFixed(2)}</strong><br><br>
                
                ${judgment}<br>
                <span class="info">固定ルール：SL −0.35% 　TP ≈ +0.5845%</span>
            `;
        }

        // 初期設定
        window.onload = function() {
            setInputMode('entry');
        };
    </script>
</body>
</html>
